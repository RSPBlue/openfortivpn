version: "3.8"

services:
  vpn:
    build: .
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - VPNADDR=vpn.example.com:443
      - VPNUSER=${VPN_USER}
      - VPNPASS=${VPN_PASS}
    networks:
      vpn_net:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

networks:
  vpn_net:
    name: vpn-internal-net
    external: true